apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hyeboard
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
images:
  - name: ghcr.io/teppyboy/hyeboard-api
    newName: ghcr.io/teppyboy/hyeboard-api
    newTag: replace-with-release-tag
  - name: ghcr.io/teppyboy/hyeboard-automation-worker
    newName: ghcr.io/teppyboy/hyeboard-automation-worker
    newTag: replace-with-release-tag

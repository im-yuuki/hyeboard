apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-pdb.yaml
  - api-hpa.yaml
  - automation-deployment.yaml
  - automation-pdb.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/teppyboy/hyeboard-api
    newName: ghcr.io/teppyboy/hyeboard-api
    newTag: latest
  - name: ghcr.io/teppyboy/hyeboard-automation-worker
    newName: ghcr.io/teppyboy/hyeboard-automation-worker
    newTag: latest

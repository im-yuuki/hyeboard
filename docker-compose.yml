# Optional headless Chrome for self-hosting the UET Google-login automation
# feature outside Cloudflare (Node/Bun deployments only — Cloudflare
# deployments use the managed Browser Rendering binding instead and don't
# need this).
#
# Usage:
#   docker compose up -d
#   HYEB_BROWSER_WS_ENDPOINT=ws://localhost:3000/chromium pnpm --filter @hyeboard/worker serve:node
#
# Every other Hyeboard feature works without this container.
services:
  chrome:
    image: ghcr.io/browserless/chromium:v2.55.4
    ports:
      - "3000:3000"
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hyeboard
      POSTGRES_USER: hyeboard
      POSTGRES_PASSWORD: hyeboard-local-only
    ports:
      - "5432:5432"
    volumes:
      - hyeboard-postgres:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - hyeboard-redis:/data
    restart: unless-stopped

volumes:
  hyeboard-postgres:
  hyeboard-redis:

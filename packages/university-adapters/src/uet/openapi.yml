  /api/student/vn/district/search:
    post:
      operationId: searchDistricts
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Search districts within a province
      description: Not currently called by adapter.ts/UniversityAdapter. size defaults to 100 in the client wrapper; provinceCode is sent in the request body, not as a query param.
      parameters:
        - name: size
          in: query

# Reverse-engineered from observed StudentHub traffic during Hyeboard adapter development.
# Unofficial, not endorsed by VNU-UET. Shapes reflect what the adapter code actually
# consumes; fields not used by Hyeboard may be omitted or incomplete.
openapi: 3.0.3
info:
  title: StudentHub API (reverse-engineered)
  version: "0.1.0"
  description: >
    Unofficial documentation of the VNU-UET StudentHub portal's HTTP API, reverse-engineered
    by observing real traffic during Hyeboard adapter development. Not endorsed by VNU-UET.
servers:
  - url: https://studenthub.uet.edu.vn
tags:
  - name: auth
    description: Pre-authentication endpoints (login, captcha, Google credential exchange).
  - name: core
    description: Authenticated student-data endpoints with a corresponding Hyeboard mapper.
  - name: extended
    description: Endpoints discovered in a HAR capture of a parent/guardian-linked account; not currently called by Hyeboard's adapter and not consumed by mapper.ts.
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      operationId: authenticateDirect
      tags: [auth]
      security: []
      summary: Direct username/password login (captcha-protected)
      description: Exchanges a student's StudentHub username, password, and solved captcha for a bearer access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName: { type: string }
                password: { type: string, format: password }
                captchaId: { type: string }
                captchaValue: { type: string }
              required: [userName, password, captchaId, captchaValue]
      responses:
        "200":
          description: Login succeeded, access token issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubDirectLoginResult" }
  /api/auth/captcha:
    get:
      operationId: getCaptchaChallenge
      tags: [auth]
      security: []
      summary: Fetch a captcha challenge for direct login
      description: Returns a captcha id and image to present to the user before calling /api/auth/login.
      responses:
        "200":
          description: Captcha challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubCaptchaChallenge" }
  /api/auth/google/callback:
    get:
      operationId: exchangeGoogleCredential
      tags: [auth]
      security: []
      summary: Exchange a Google OAuth code for a StudentHub access token
      description: Called after a successful Google sign-in popup; the returned token is used as bearerAuth for all other endpoints.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Access token issued for the linked account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubGoogleLogin" }
  /api/student/detail:
    get:
      operationId: getProfile
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the logged-in student's profile
      description: Response is passed through mapStudent (mapper.ts) to build Hyeboard's Student profile, normalizing Vietnamese name casing.
      responses:
        "200":
          description: Student profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubStudent" }
  /api/student/term/getTerm:
    post:
      operationId: getTerms
      tags: [core]
      security: [{bearerAuth: []}]
      summary: List the student's academic terms
      description: Each item is passed through mapTerm (mapper.ts) to build Hyeboard's Term list; the first entry is treated as the current term.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Array of terms.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubTerm" }
  /api/student/tkb:
    post:
      operationId: getTimetable
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the student's weekly class timetable
      description: Each item is passed through mapStudentHubClass (mapper.ts), which resolves the ISO weekday into a date within the current week and applies the verified period-to-clock-time table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                termCode: { type: string }
      responses:
        "200":
          description: Array of class sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubClassSession" }
  /api/student/schedule-alert:
    get:
      operationId: getScheduleAlert
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get today's (or a given day's) schedule-alert groups
      description: Flattened groups are passed through mapStudentHubScheduleAlert (mapper.ts, via adapter.ts's flattenScheduleAlert) to build ClassSession entries, including the Canvas course link when present.
      parameters:
        - name: day
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Array of schedule-alert groups (observed nested as an array of arrays).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items: { $ref: "#/components/schemas/StudentHubScheduleAlertSession" }
  /api/student/count-course-term:
    get:
      operationId: getCourseCount
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the student's in-term vs. completed course counts
      description: Consumed directly in adapter.ts's getDashboard (no dedicated mapper.ts function) to build the dashboard's courseCount summary.
      responses:
        "200":
          description: Course count summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubCourseCount" }
  /api/student/kqht:
    get:
      operationId: getGrades
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the student's course grades
      description: Each item is passed through mapStudentHubGrade (mapper.ts) to build Hyeboard's Grade list.
      responses:
        "200":
          description: Array of grades.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubGrade" }
  /api/student/results:
    get:
      operationId: getGpa
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the student's GPA/CPA summary
      description: Passed through mapStudentHubGpa (mapper.ts) to build Hyeboard's GpaSummary.
      responses:
        "200":
          description: GPA/CPA summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubGpa" }
  /api/student/exam-schedule:
    post:
      operationId: getExams
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the student's exam schedule
      description: Each item is passed through mapStudentHubExam (mapper.ts) to build Hyeboard's ExamSession list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                termCode: { type: string }
      responses:
        "200":
          description: Array of exam sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubExam" }
  /api/student/getAllBills:
    post:
      operationId: getBills
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the student's tuition bills
      description: Passed through mapTuition/mapStudentHubBill (mapper.ts) to build Hyeboard's TuitionStatus, deriving a paid/partial/unpaid/credit status per bill.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Array of tuition bills.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubBill" }
  /api/noti/user/{studentCode}:
    get:
      operationId: getNotifications
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get a student's notifications
      description: The content array is passed through mapStudentHubNotifications (mapper.ts) to build Hyeboard's Notification list, tagged with source "studenthub".
      parameters:
        - name: studentCode
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Paged notification list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubNotificationPage" }
  /api/student/news:
    get:
      operationId: getNews
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get UET news items
      description: Each item is passed through mapStudentHubNews (mapper.ts) to build Hyeboard's NewsItem list.
      responses:
        "200":
          description: Array of news items.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubNews" }
  /api/student/training-points/assessment:
    get:
      operationId: getTrainingPointAssessment
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the student's training-point criteria assessment
      description: Combined with getTrainingPointLockAssessment's result inside mapTrainingPoints (mapper.ts) to build Hyeboard's TrainingPoint list (a locked final-score entry plus one entry per criterion).
      parameters:
        - name: studentCode
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Training-point assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubTrainingPointAssessment" }
  /api/student/training-points/assessment/lock-assessment:
    get:
      operationId: getTrainingPointLockAssessment
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the student's locked/final training-point totals for a term
      description: Feeds mapTrainingPoints (mapper.ts) alongside getTrainingPointAssessment's result to produce the locked final-score entry; adapter.ts treats failure here as non-fatal.
      parameters:
        - name: studentCode
          in: query
          required: true
          schema: { type: string }
        - name: termCode
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Locked training-point assessment totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubTrainingPointLockAssessment" }
  /api/student/request/display:
    get:
      operationId: getRequests
      tags: [core]
      security: [{bearerAuth: []}]
      summary: Get the student's submitted service requests
      description: Each item is passed through mapStudentHubRequest (mapper.ts) to build Hyeboard's ServiceRequest list.
      responses:
        "200":
          description: Array of service requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubServiceRequest" }
  /api/student/request/type:
    get:
      operationId: getRequestTypes
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: List the available service-request type options
      description: Defined on StudentHubClient but not currently called by adapter.ts/UniversityAdapter - no mapper.ts function consumes it yet.
      responses:
        "200":
          description: Array of request-type label/value options.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubRequestType" }
  /api/student/mandatory-task/incomplete:
    get:
      operationId: getMandatoryTasks
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: List the student's incomplete mandatory tasks
      description: Defined on StudentHubClient but not currently called by adapter.ts/UniversityAdapter; response shape has not been reverse-engineered beyond a bare array (typed unknown[] in types.ts).
      responses:
        "200":
          description: Array of incomplete mandatory tasks (shape not yet reverse-engineered).
          content:
            application/json:
              schema:
                type: array
                items: {}
  /api/student/admission/info:
    get:
      operationId: getAdmissionInfo
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Get admission/enrollment document status
      description: Not currently called by adapter.ts/UniversityAdapter; discovered via a parent/guardian-account HAR capture.
      responses:
        "200":
          description: Admission info.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubAdmissionInfo" }
  /api/student/avatar:
    get:
      operationId: getAvatar
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Get the student's avatar
      description: Not currently called by adapter.ts/UniversityAdapter. Bypasses the JSON envelope entirely - client code calls response.text() directly; observed mimetype was text/plain (likely a URL or base64 blob), not JSON.
      responses:
        "200":
          description: Plain-text avatar payload (not JSON).
          content:
            text/plain:
              schema: { type: string }
  /api/student/criteria/role/is-committee:
    get:
      operationId: getIsCommittee
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Check whether the student holds a committee role
      description: Not currently called by adapter.ts/UniversityAdapter.
      responses:
        "200":
          description: Committee-role check result.
          content:

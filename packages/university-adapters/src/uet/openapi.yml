          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Array of optional bills.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubBillOptional" }
  /api/student/getBill/checkno:
    post:
      operationId: getBillCheckNo
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Check bill number/status

  /dashboard-banner.json:
    get:
      operationId: getDashboardBanner
      tags: [extended]
      security: []
      summary: Get the site-wide dashboard banner config
      description: Not currently called by adapter.ts/UniversityAdapter. Static JSON file, not under /api/, no auth required per client code's comment.
      responses:
        "200":
          description: Dashboard banner config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubDashboardBanner" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StudentHubDirectLoginResult:
      type: object
      properties:
        code: { type: string }
        login:
          type: object
          properties:
            accessToken: { type: string }
            accountCode: { type: string }
          required: [accessToken]
      required: [code]
    StudentHubCaptchaChallenge:
      type: object
      properties:
        captchaId: { type: string }
        image: { type: string }
      required: [captchaId, image]
    StudentHubGoogleLogin:
      type: object
      properties:
        accountCode: { type: string }
        username: { type: string }
        name: { type: string }
        email: { type: string }
        accessToken: { type: string }
        refreshToken: { type: string }
        role: { type: string }
        dependAccountCode: { type: string }
      required: [accessToken]
    StudentHubStudent:
      type: object
      properties:
        id: { oneOf: [{ type: string }, { type: number }] }
        personCode: { type: string }
        studentCode: { type: string }
        name: { type: string }

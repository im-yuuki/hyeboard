          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Bill check result (shape not reverse-engineered).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/student/person/detail:
    get:
      operationId: getPersonDetail
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Get the student's personal/residence details

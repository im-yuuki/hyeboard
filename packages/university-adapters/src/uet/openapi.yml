  /api/student/vn/province/search:
    post:
      operationId: searchProvinces
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Search the province reference list
      description: Not currently called by adapter.ts/UniversityAdapter. size defaults to 100 in the client wrapper.

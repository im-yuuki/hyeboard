      operationId: getSemesterAdvice
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Get advised courses for the student's upcoming semester
      description: Not currently called by adapter.ts/UniversityAdapter.
      responses:
        "200":
          description: Array of semester-advice course entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentHubSemesterAdvice" }
  /api/student/semester-advice/status:
    get:
      operationId: getSemesterAdviceStatus
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Get the semester-advice workflow status
      description: Not currently called by adapter.ts/UniversityAdapter; response shape not reverse-engineered beyond this (typed unknown in types.ts).
      responses:
        "200":
          description: Semester-advice status (shape not reverse-engineered).
          content:

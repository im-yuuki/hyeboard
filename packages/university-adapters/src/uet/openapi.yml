              schema: { $ref: "#/components/schemas/StudentHubCommitteeCheck" }
  /api/student/criteria/student-info:
    get:
      operationId: getCriteriaStudentInfo
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Get criteria-assessment student info
      description: Not currently called by adapter.ts/UniversityAdapter; response shape not reverse-engineered beyond this (typed unknown in types.ts).
      parameters:
        - name: studentCode
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Criteria student info (shape not reverse-engineered).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/student/dktn:
    get:
      operationId: getDktn
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Get the student's DKTN (course-registration) status/document
      description: Not currently called by adapter.ts/UniversityAdapter; typed as a bare string in types.ts (envelope's data field is a plain string, not an object).
      responses:
        "200":
          description: DKTN status/document as a plain string.
          content:
            application/json:
              schema: { type: string }
  /api/student/dktn/course:
    get:
      operationId: getDktnCourses
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Get the student's DKTN course-registration options
      description: Not currently called by adapter.ts/UniversityAdapter.
      responses:
        "200":
          description: DKTN course groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentHubDktnCourses" }
  /api/student/getBill/bill-optional/list:
    post:
      operationId: getBillOptionalList
      tags: [extended]
      security: [{bearerAuth: []}]
      summary: Get the student's optional/supplementary bills
      description: Not currently called by adapter.ts/UniversityAdapter.
      requestBody:
